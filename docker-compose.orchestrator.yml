services:
  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator.Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      ORCHESTRATOR_CONFIG: /orchestrator/config/orchestrator.yaml
      ORCHESTRATOR_REDIS_URL: ${ORCHESTRATOR_REDIS_URL:?ORCHESTRATOR_REDIS_URL is required}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:?ORCHESTRATOR_API_KEY is required}
      WORKER_API_KEY: ${WORKER_API_KEY:-}
      ORCHESTRATOR_ALLOW_PUBLIC_HEALTH: ${ORCHESTRATOR_ALLOW_PUBLIC_HEALTH:-true}
      ORCHESTRATOR_ALLOW_PUBLIC_DOCS: ${ORCHESTRATOR_ALLOW_PUBLIC_DOCS:-false}
      ORCHESTRATOR_RATE_LIMIT_PER_MINUTE: ${ORCHESTRATOR_RATE_LIMIT_PER_MINUTE:-30}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-flowkit_orchestrator}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    volumes:
      - ./config:/orchestrator/config
      - ./orchestrator/logs:/orchestrator/logs
